name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # last one becomes the default JAVA_HOME; both are found as toolchains
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew check --stacktrace

  smoke:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew smokeTest --stacktrace
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-results
          path: synthetixlib-example/run/smoke-*/selftest-result.json
          if-no-files-found: ignore
